name: CI

# A3.1: ./gradlew check раньше гонялся только руками. Юнит-тесты, lint, стражи инвариантов
# (verifyInvariantGuards, verify<Variant>MergedManifest) и сборка debug-APK на каждый push/PR.
# Инструментальные тесты (connectedCheck) требуют эмулятора — запускаются вручную или отдельным заданием.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: ./gradlew check assembleDebug --no-daemon
